name: Weekly Heritage Sync

on:
  schedule:
    # Mondays at 03:00 UTC (11:00 Beijing)
    - cron: "0 3 * * 1"
  workflow_dispatch: # allow manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Sync Wikidata
        run: npm run sync:wikidata

      - name: Sync Met
        run: npm run sync:met

      - name: Sync Commons (artifacts)
        run: npm run sync:commons

      - name: Sync Museums
        run: npm run sync:museums

      - name: Download images
        run: npm run sync:download-images

      - name: Detect drift
        id: drift
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No upstream drift detected."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "### Detected drift" >> "$GITHUB_STEP_SUMMARY"
            git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create Pull Request
        if: steps.drift.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/weekly-heritage-sync
          delete-branch: true
          commit-message: "chore(sync): weekly heritage data refresh"
          title: "chore(sync): weekly heritage data refresh"
          body: |
            Automated weekly sync run.

            This PR reflects upstream changes picked up from:
            - Wikidata (`scripts/generated/wikidata/`)
            - The Met Open Access API (`scripts/generated/met/`)
            - Wikimedia Commons image/license metadata (`scripts/generated/commons/`, `scripts/generated/museums/`)
            - Self-hosted image refresh (`public/images/`)

            Review the diff: if labels, licenses, or authors have shifted, the
            upstream record has been corrected and we should merge. If the
            change looks wrong (e.g. a hash reshuffled into a worse image),
            close the PR or edit the seed files.

            Generated by `.github/workflows/sync.yml`.
          labels: |
            automated
            heritage-sync
